name: EAS Build Android

# Ya NO compila en cada push a master. Se lanza:
#  - al subir un tag de versión (git tag v1.4.1 && git push origin v1.4.1), o
#  - a mano desde GitHub → Actions → "EAS Build Android" → Run workflow.
# Ver "Cómo lanzar un build" en docs/WeatherApp_Proyecto.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build AAB (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Con un tag, debe coincidir con la versión de app.json (v1.4.1 ↔ "version": "1.4.1")
      - name: Check tag matches app.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con app.json ($APP_VERSION)"
            exit 1
          fi
          echo "Versión $APP_VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        continue-on-error: true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform android --profile production --non-interactive